name: Android build (Fastlane)

# NOT RUN YET — no GitHub repo is connected from this chat and no
# signing secrets have been provided. This workflow is a starter
# for Phase 2. Do not run it until: (1) the repo is pushed to
# GitHub, (2) the Android native project exists via
# `npx cap add android`, (3) keystore + Play service-account
# secrets are stored in GitHub Secrets (never in this file).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Fastlane beta (Play Internal)
        run: bundle exec fastlane android beta
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
